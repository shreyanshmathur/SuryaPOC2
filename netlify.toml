[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Frontend-only Netlify deployment.
# The Express backend should be hosted separately on Render/Railway/Fly.
# Option A: set VITE_API_BASE in Netlify to the backend URL.
# Option B: keep VITE_API_BASE blank and update the /api redirect below.

[[redirects]]
  from = "/api/*"
  to = "https://surya-poc-backend.onrender.com/api/:splat"
  status = 200
  force = true

# SPA catch-all. Keep this last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
