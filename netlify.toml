[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# API proxy → Render backend
[[redirects]]
  from   = "/api/*"
  to     = "https://suryapoc2.onrender.com/api/:splat"
  status = 200
  force  = true

# SPA catch-all (must be last)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
