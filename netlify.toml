[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# In the Netlify UI, set VITE_API_BASE to your backend URL, e.g.:
#   VITE_API_BASE = https://surya-poc-backend.onrender.com
# Leave it blank if you are using the /api redirect rule below.

# ── API proxy → backend (Render / Railway / any host) ──────────────────────
# Replace the `to` URL with your deployed backend URL after deploying the backend.
[[redirects]]
  from   = "/api/*"
  to     = "https://surya-poc-backend.onrender.com/api/:splat"
  status = 200
  force  = true

# ── SPA catch-all (must be last) ────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
