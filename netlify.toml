[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@napi-rs/canvas"]

# Demo API runs through a Netlify Function.
# For a long-running production Telegram poller, host server/index.js on Render/Railway/Fly.

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA catch-all. Keep this last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
